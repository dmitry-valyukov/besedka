# Проверка пул-реквеста: всё дерево Беседки, клиент форума с его окном
# включительно, собранное и проверенное тестами на Windows-машине GitHub, Debug
# и Release рядом, с флагами самого дерева и ничем сверх них.
#
# wxl Беседка берёт пакетом NuGet WinXL (пресет x64): поставщик
# cmake/winxl-provider.cmake восстанавливает его для find_package(wxl) по
# nuget.config и файлу блокировки packages.lock.json, который закрепляет
# версию. WinXL берётся из локального каталога пакетов feed/, а в него — из
# сценария winxl.yml: тот собирает пакет этой версии из wxl на коммите main с
# этой версией её же действиями и держит его в кэше Actions. Проверяется то
# сочетание, которое потом окажется в main Беседки; PR, которому нужна ещё не
# влитая правка wxl, остаётся красным на winxl, пока её не вольют.
#
# Тулсет — MSVC 14.53 из Build Tools канала Insiders, он ставится на каждом
# запуске, по той же причине, что у wxl (её .github/workflows/ci.yml): 14.51 из
# образа неверно компилирует корутину, чей final_suspend() возвращает
# suspend_never, в оптимизированном коде с /EHsc (.github/actions/build-tools).
#
# CMake — 4.5.0, тоже ставится на каждом запуске (.github/actions/cmake, копия
# действия wxl): дерево, как и wxl, требует 4.5, а в образе windows-2025 — 4.4.5.
#
# Пакет несёт готовые библиотеки wxl, генератор и профили; пакеты Windows App
# SDK, проекцию cppwinrt и обёртки профиля Беседки делает сама настройка и
# сборка: настройка восстанавливает пакеты и строит проекцию в своём каталоге
# сборки (MSBuild той установки Build Tools, в которой есть компонент C++
# WinUI), а сборка запускает генератор пакета и компилирует обёртки вместе с
# клиентом.
#
# Debug и Release собираются с предупреждениями как ошибками
# (CMAKE_COMPILE_WARNING_AS_ERROR на настройке, у MSVC это /WX): правка,
# которая приносит предупреждение компилятора в том, что компилирует сборка, —
# в коде Беседки, в обёртках её профиля или в googletest, — останавливает
# проверку. Ни пресеты, ни CMakeLists.txt его не ставят: локальная сборка
# показывает предупреждения, не останавливаясь на них.
name: ci

# merge_group: ветка-кандидат очереди слияния, main плюс стоящие в очереди
# пул-реквесты, проверяемая до того, как стать main.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Новый пуш в тот же пул-реквест делает старый запуск ненужным.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Пакет WinXL версии из packages.lock.json: из кэша или собранный заново.
  winxl:
    uses: ./.github/workflows/winxl.yml

  # И при красном winxl: пропущенное задание не разворачивает матрицу, и
  # обязательные проверки build (Debug) и build (Release) не пришли бы вовсе.
  # Здесь они красные и называют причину.
  build:
    needs: [winxl]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            preset: x64-debug
          - config: Release
            preset: x64-release
    name: build (${{ matrix.config }})
    runs-on: windows-2025
    # Библиотеки wxl приходят готовыми, но обёртки профиля Беседки (rich wxl и сверх него)
    # компилируются здесь, вместе с самой Беседкой.
    timeout-minutes: 120
    env:
      DEVCMD: C:\BuildToolsInsiders\Common7\Tools\VsDevCmd.bat
      VCVARS: -vcvars_ver=14.53
      # Куда восстановление кладёт пакеты; winui-srcgen и winxl находят пакеты
      # Windows App SDK по списку, который пишет настройка.
      NUGET_PACKAGES: C:\nuget-packages
      # MSBuild читает переменные среды как свойства: восстановление WinXL идёт
      # в режиме блокировки, по версиям из packages.lock.json, и файл
      # блокировки, не совпавший со ссылкой поставщика, останавливает
      # настройку, а не переписывается.
      RestoreLockedMode: true
    steps:
      - name: The package WinXL
        shell: pwsh
        env:
          RESULT: ${{ needs.winxl.result }}
        run: |
          if ($env:RESULT -ne 'success') { throw "winxl is $env:RESULT: no package WinXL of the locked version to build with" }

      - uses: actions/checkout@v4
        with:
          path: Besedka

      # CMake 4.5, которого требуют Беседка и wxl: в образе машины он старее.
      - uses: ./Besedka/.github/actions/cmake

      - uses: ./Besedka/.github/actions/build-tools

      # Из wxl на коммите пакета — только сценарий публикации и global.json
      # рядом с ним, который просит у dotnet нужный SDK.
      - uses: actions/checkout@v4
        with:
          repository: wxl-project/wxl
          ref: ${{ needs.winxl.outputs.commit }}
          path: wxl
          sparse-checkout: tools/package
          persist-credentials: false

      - uses: actions/cache/restore@v4
        with:
          path: winxl-package
          key: ${{ needs.winxl.outputs.key }}
          fail-on-cache-miss: true

      # В feed/ Беседки, источник local её nuget.config; затем хеш этого пакета
      # — в файл блокировки (tools/winxl-lock.ps1 объясняет почему).
      - name: Publish WinXL into the local feed
        shell: pwsh
        env:
          VERSION: ${{ needs.winxl.outputs.version }}
        run: |
          cmake "-DWXL_PUBLISH_PACKAGE=$PWD/winxl-package/WinXL.$env:VERSION.nupkg" "-DWXL_PUBLISH_FEED=$PWD/Besedka/feed" -P wxl/tools/package/publish.cmake
          if ($LASTEXITCODE -ne 0) { throw "publish.cmake exited with $LASTEXITCODE" }
          & ./Besedka/tools/winxl-lock.ps1

      # googletest настройка берёт из его репозитория на закреплённой метке
      # (wxl_gtest.cmake из пакета WinXL, WXL_GTEST_SCRIPT) и собирает вместе с
      # тестами.
      - name: Configure
        shell: cmd
        working-directory: Besedka
        run: |
          call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
          cmake --version
          ninja --version
          cmake --preset x64 -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      # find_package(wxl) взял пакет, который поставщик восстановил, той версии,
      # что собрал winxl.yml, а не что-то другое с машины.
      - name: Check the package the configure took
        shell: pwsh
        working-directory: Besedka
        env:
          VERSION: ${{ needs.winxl.outputs.version }}
        run: |
          $dir = (Select-String -Path build/x64/CMakeCache.txt -Pattern '^wxl_DIR:[A-Z]+=(.*)$').Matches[0].Groups[1].Value
          "wxl_DIR $dir"
          if ($dir -notmatch "/winxl/$([regex]::Escape($env:VERSION))/build/native/lib/cmake/wxl$") {
            throw "find_package(wxl) took $dir, not WinXL $env:VERSION restored by the provider"
          }
          "WXL_DIR=$dir" >> $env:GITHUB_ENV

      # -k 0: все ошибки компиляции правки сразу, а не только первая.
      - name: Build
        id: build
        shell: cmd
        working-directory: Besedka
        run: |
          call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
          cmake --build build\x64 --config ${{ matrix.config }} -- -k 0

      - name: Test
        shell: cmd
        working-directory: Besedka
        run: |
          call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
          ctest --preset ${{ matrix.preset }} --output-on-failure --timeout 300 --output-junit ctest.xml

      # Окна WinUI не открывает ни один тест, его открывает клиент форума.
      # Сначала экспериментальная среда Windows App Runtime, которой просят
      # обёртки, — её ставит утилита winxl из пакета по списку восстановления
      # настройки; потом Беседка на двадцать секунд: она показывает заставку и
      # идёт за списком форумов на api.rsdn.org, а отказ сети или сервера
      # оставляет её на заставке с причиной и кнопкой повтора, так что главное
      # окно должно появиться на рабочем столе машины в любом случае. После
      # красных тестов тоже — это разные вопросы, — но не после красной сборки:
      # запускать нечего.
      - name: Install the experimental Windows App Runtime
        if: (success() || failure()) && steps.build.outcome == 'success'
        shell: pwsh
        working-directory: Besedka
        run: |
          $winxl = Join-Path $env:WXL_DIR '../../../bin/winxl.exe'
          & $winxl runtime install --packages build\x64\wxl.packages\restored-packages.json
          if ($LASTEXITCODE -ne 0) { throw "winxl runtime install exited with $LASTEXITCODE" }

      # Процесс оконный, и отказ wxl уходит в stderr и OutputDebugString, которых
      # журнал не видит: потоки Беседки перенаправлены в файлы и печатаются.
      - name: Start Besedka
        if: (success() || failure()) && steps.build.outcome == 'success'
        shell: pwsh
        working-directory: Besedka
        run: |
          $exe = "build\x64\App\${{ matrix.config }}\Besedka.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          $exe = Get-Item $exe
          $out = Join-Path $env:RUNNER_TEMP 'besedka.out'
          $err = Join-Path $env:RUNNER_TEMP 'besedka.err'
          function Show-BesedkaOutput {
            foreach ($file in $out, $err) {
              if (Test-Path $file) {
                "---- $file"
                Get-Content $file
              }
            }
          }
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 20
          $p.Refresh()
          if ($p.HasExited) {
            Show-BesedkaOutput
            throw "Besedka exited within 20 s, code $($p.ExitCode)"
          }
          $window = $p.MainWindowHandle
          "running after 20 s; main window handle $window, title '$($p.MainWindowTitle)'"
          Stop-Process -Id $p.Id
          if ($window -eq 0) {
            Show-BesedkaOutput
            throw 'Besedka runs but shows no main window'
          }
          Show-BesedkaOutput

      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.config }}
          path: |
            Besedka/build/x64/Testing/Temporary/
            Besedka/build/x64/ctest.xml
            Besedka/build/x64/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
